review:
  status: agent-reviewed
  notes: >-
    Separate agent review checked ordinary-convergent semantics, indexing,
    exact departures, finite-endpoint alternatives, sharpness quantifiers,
    and the stability equality locus. Verification.md records the
    reproducible mechanical checks. No independent human specialist
    review or worldwide-priority determination is claimed.
status:
  scope: >-
    The compared actual-run statements use the ordinary convergents and
    actual floor/fract digits of every irrational real input. Sharpness
    varies the finite index and does not assert optimality at a separately
    fixed index. The real stability parameter ranges over all a at least two.
    Formal coverage of additional boundary and rectangle results is
    specified in Verification.md and the Comparator configuration.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: ContinuedFractionBounds.actual_run_bounds
      file: ContinuedFractionBounds/ActualRuns.lean
      comparator_config: comparator.json
    - declaration: ContinuedFractionBounds.actual_run_lower_sharp
      file: ContinuedFractionBounds/ActualRuns.lean
      comparator_config: comparator.json
    - declaration: ContinuedFractionBounds.actual_run_upper_sharp
      file: ContinuedFractionBounds/ActualRuns.lean
      comparator_config: comparator.json
    - declaration: ContinuedFractionBounds.global_stability
      file: ContinuedFractionBounds/Stability.lean
      comparator_config: comparator.json
    - declaration: ContinuedFractionBounds.actual_stabilityConstant_optimal
      file: ContinuedFractionBounds/Applications.lean
      comparator_config: comparator.json
fidelity:
  divergences: >-
    Lean numbers the triple n,n+1,n+2 and the central digit n+2;
    the written proof numbers the same triple n-1,n,n+1 for n at least one.
    Closed run cells include rational endpoints solely to express sharp
    suprema and infima. Actual infinite futures are irrational, which
    supplies strictness. Finite reversed expansions ending in one are retained.
