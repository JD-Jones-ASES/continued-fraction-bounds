fidelity:
  divergences: >-
    The written account and Lean both number the triple n,n+1,n+2 and
    the central digit n+2. Closed run cells include rational endpoints to
    express sharp suprema and infima. Actual infinite futures are
    irrational, which supplies strictness in terminated future classes.
    Finite reversed expansions ending in one are retained. The optional
    empty-past convention is outside the ordinary triples formalized here.
