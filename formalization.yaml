review:
  status: agent-reviewed
  notes: >-
    Separate agent review checked ordinary-convergent semantics, indexing,
    exact departures, finite-endpoint alternatives, sharpness quantifiers,
    both stability equality loci, and sharp digit-window quantifiers. Verification.md records the
    reproducible mechanical checks. No independent human specialist
    review or worldwide-priority determination is claimed.
status:
  scope: >-
    The compared contracts use actual ordinary convergents and floor/fract
    digits of irrational real inputs. Exact-run sharpness allows the finite
    index to vary. Separate fixed-word sharpness preserves the complete
    positive finite word and its index. Rectangle optimization covers every
    real parameter at least one and all closed rectangles in the unit
    square, including degenerate rectangles and the lower-envelope zero-axis
    exception. Both inverse inequalities cover every real parameter at least two.
    Boundary contracts include exhausted finite pasts, the characterization
    of infinite constant futures, genuine attained metallic-future examples,
    and exact alternating coefficient formulas. Quantitative contracts give
    two-sided run-gap bounds and optimal symmetric digit-window thresholds
    over actual triples with varying finite index. Four-endpoint rectangle
    cutoffs also force asymmetric actual windows; separate actual optimality
    for asymmetric windows is not asserted. Rational executable definitions
    are proved equal to the corresponding real exact-run constants. Verification.md
    and comparator.json specify the complete compared declarations.
  sorry_count: 0
  sorry_in_definitions: 0
